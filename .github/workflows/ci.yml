---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform, Kustomize & manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate (module + dev env)
        run: |
          for dir in terraform/modules/eks terraform/environments/dev; do
            echo "== validating $dir =="
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      - name: tfsec (IaC security scan)
        # Scan the Terraform written in this repo. Findings inside the
        # downloaded community VPC/EKS modules are excluded - those are
        # third-party code, maintained and scanned upstream.
        run: |
          docker run --rm -v "$PWD/terraform:/src" aquasec/tfsec:v1.28.11 \
            /src --exclude-downloaded-modules --minimum-severity HIGH

      - name: Install kustomize & kubeconform
        run: |
          # Install into /tmp so the installer's output binary does not clash
          # with this repo's kustomize/ directory.
          ( cd /tmp && curl -sfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash )
          sudo mv /tmp/kustomize /usr/local/bin/
          curl -sfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: Build overlays and validate manifests
        run: |
          for env in dev qa prod; do
            echo "== kustomize build overlays/$env =="
            kustomize build "kustomize/overlays/$env" | tee "/tmp/$env.yaml"
            kubeconform -strict -summary -ignore-missing-schemas "/tmp/$env.yaml"
          done

      - name: Validate Argo CD manifests
        run: |
          kubeconform -ignore-missing-schemas -summary \
            argocd/root-app.yaml argocd/apps/*.yaml

  gitops-e2e:
    name: GitOps e2e (kind + Argo CD sync)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: gitops-demo

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl -n argocd rollout status deploy/argocd-server --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s

      - name: Apply the app-of-apps
        run: kubectl apply -f argocd/root-app.yaml

      - name: Wait for all Applications to be Synced & Healthy
        run: |
          for i in $(seq 1 72); do
            total=$(kubectl -n argocd get applications -o json | jq '.items | length')
            ok=$(kubectl -n argocd get applications -o json \
              | jq '[.items[] | select(.status.sync.status=="Synced" and .status.health.status=="Healthy")] | length')
            echo "attempt $i: ${ok}/${total} applications Synced+Healthy"
            kubectl -n argocd get applications \
              -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status --no-headers || true
            if [ "${total}" -ge 4 ] && [ "${ok}" -ge 4 ]; then
              echo "ALL APPLICATIONS SYNCED & HEALTHY"; exit 0
            fi
            sleep 10
          done
          echo "Applications did not converge in time"
          kubectl -n argocd get applications -o yaml | tail -120
          exit 1

      - name: Show deployed workloads across environments
        run: |
          kubectl get ns demo-dev demo-qa demo-prod
          kubectl get pods -A -l app.kubernetes.io/part-of=gitops-demo -o wide
          echo "Replica counts per environment (expect dev=1, qa=2, prod=3):"
          for ns in demo-dev demo-qa demo-prod; do
            echo -n "$ns: "; kubectl -n "$ns" get deploy web -o jsonpath='{.status.readyReplicas}'; echo
          done
